# This is the neoforge.mods.toml file of the Sandbox mod.
#
# Sandbox is the probe of the mod family: it exists to prove that a member of the family can
# use the contracts of Genesis through nothing but `implementation project(':base')`.

license="${mod_license}"

issueTrackerURL="https://github.com/KevinT742/Sandbox/issues"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

description='''
Sandbox is the probe of the mod family.

It is deliberately small. It registers one block and one item, both described with the material
template of Genesis, and it reads the magic of the ground under the player while the game runs.

If this mod works, then writing the next member of the family is a matter of copying this
directory.
'''

authors="Kevin742"

# A dependency on NeoForge itself.
[[dependencies.${mod_id}]] #mandatory
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="${neo_version}" #mandatory
    ordering="NONE"
    side="BOTH"

# A dependency on Minecraft itself.
[[dependencies.${mod_id}]] #mandatory
    modId="minecraft" #mandatory
    type="required" #mandatory
    versionRange="${minecraft_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

# Genesis is the foundation of the family. The probe needs it for the material template and
# for the magic of the world.
[[dependencies.${mod_id}]] #mandatory
    modId="genesis" #mandatory
    type="required" #mandatory
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"
